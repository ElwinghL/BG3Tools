name: CI

# Miroir GitHub Actions de .gitea/workflows/ci.yml (même déclencheurs, même
# suite pytest) — Gitea reste la CI de référence, ce doublon sert aux PR/push
# GitHub le cas échéant.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3

      - name: Installer les dépendances
        run: uv sync --extra dev

      - name: Lancer pytest
        run: uv run pytest -q
