[project]
name = "bg3-mod-tui"
version = "1.0.0"
description = "TUI de gestion et téléchargement de mods BG3 (Nexus Mods / mod.io)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomlkit>=0.12",
    "zstandard>=0.22",
    "lz4>=4.3",
]

[project.scripts]
bg3-mod-tui = "bg3_mod_tui.__main__:run"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling lit directement les métadonnées/dépendances de [project]
# ci-dessus (PEP 621) ; cette section ne sert qu'à préciser le paquet à
# empaqueter (sinon hatchling ne le détecte pas automatiquement).
[tool.hatch.build.targets.wheel]
packages = ["bg3_mod_tui"]
