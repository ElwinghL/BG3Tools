[project]
name = "bg3-mod-tui"
version = "1.0.0"
description = "TUI de gestion et téléchargement de mods BG3 (Nexus Mods / mod.io)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomlkit>=0.12",
    "zstandard>=0.22",
    "textual-image>=0.13",
]

[project.scripts]
bg3-mod-tui = "bg3_mod_tui.__main__:run"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

# poetry-core lit directement les métadonnées/dépendances de [project]
# ci-dessus (PEP 621) ; cette section ne sert qu'à préciser le paquet à
# empaqueter (sinon poetry-core ne le détecte pas automatiquement).
[tool.poetry]
packages = [{ include = "bg3_mod_tui" }]
