[project]
name = "bg3-mod-tui"
version = "1.0.0"
description = "TUI de gestion et téléchargement de mods BG3 (Nexus Mods / mod.io)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # >=3.0 : Textual 2.0.0 a introduit la sélection de texte au clic
    # (ALLOW_SELECT), avec un bug (corrigé en 3.0.0, PR Textualize/textual#5627)
    # qui ne respectait pas `ALLOW_SELECT = False` sur `Button` — cause du
    # bug "un clic sur un bouton sélectionne son texte" (TODO 15a). `>=0.58`
    # laissait `pip`/`uv` résoudre n'importe quelle version 2.x affectée.
    "textual>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomlkit>=0.12",
    "zstandard>=0.22",
    "lz4>=4.3",
    # Importé directement (bg3_mod_tui/log_format.py) : bien que déjà tiré
    # transitivement par `textual`, on le déclare explicitement puisqu'il
    # s'agit d'une dépendance directe du package, pas seulement de Textual.
    "rich>=13.0",
]

[project.scripts]
bg3-mod-tui = "bg3_mod_tui.__main__:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["bg3_mod_tui"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# Seuil global (pas par fichier — pytest-cov/coverage.py n'a pas cette
# granularité nativement) : la CI échoue si la couverture totale de
# bg3_mod_tui tombe sous 75%.
fail_under = 75

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling lit directement les métadonnées/dépendances de [project]
# ci-dessus (PEP 621) ; cette section ne sert qu'à préciser le paquet à
# empaqueter (sinon hatchling ne le détecte pas automatiquement).
[tool.hatch.build.targets.wheel]
packages = ["bg3_mod_tui"]
