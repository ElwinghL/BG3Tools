[project]
name = "bg3-mod-tui"
version = "1.0.0"
description = "TUI de gestion et téléchargement de mods BG3 (Nexus Mods / mod.io)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # >=3.0 : Textual 2.0.0 a introduit la sélection de texte au clic
    # (ALLOW_SELECT), avec un bug (corrigé en 3.0.0, PR Textualize/textual#5627)
    # qui ne respectait pas `ALLOW_SELECT = False` sur `Button` — cause du
    # bug "un clic sur un bouton sélectionne son texte" (TODO 15a). `>=0.58`
    # laissait `pip`/`uv` résoudre n'importe quelle version 2.x affectée.
    "textual>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomlkit>=0.12",
    "zstandard>=0.22",
    "lz4>=4.3",
    # Importé directement (bg3_mod_tui/log_format.py) : bien que déjà tiré
    # transitivement par `textual`, on le déclare explicitement puisqu'il
    # s'agit d'une dépendance directe du package, pas seulement de Textual.
    "rich>=13.0",
]

[project.scripts]
bg3-mod-tui = "bg3_mod_tui.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Typage statique (informationnel en CI pour l'instant, voir ci.yml et
    # .claude/TODO.md : base legacy avec des erreurs préexistantes non
    # corrigées en bloc dans cette passe).
    "mypy>=1.11",
    # Complexité cyclomatique (radon = mesure, xenon = seuil/gate en CI).
    "radon>=6.0",
    "xenon>=0.9",
    # Analyse de sécurité statique.
    "bandit>=1.7",
]
# Génération des graphes PNG du benchmark .pak (scripts/pak_bench/report.py)
# — optionnel : le rapport Markdown se génère sans, le PNG est juste omis.
bench = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# 67 erreurs préexistantes sur 10 fichiers au moment de l'ajout de l'outil
# (voir .claude/TODO.md) : pas corrigées en bloc dans cette passe, donc pas
# de mode strict pour l'instant — la CI lance mypy en informationnel
# (continue-on-error) plutôt que de bloquer sur cette base.

[tool.bandit]
# Uniquement le code livré (bg3_mod_tui/) : les tests utilisent volontairement
# des patterns que bandit signalerait sans intérêt ici (chemins temporaires,
# assert, etc.).
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["bg3_mod_tui"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# Seuil global (pas par fichier — pytest-cov/coverage.py n'a pas cette
# granularité nativement) : la CI échoue si la couverture totale de
# bg3_mod_tui tombe sous 75%.
fail_under = 75

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling lit directement les métadonnées/dépendances de [project]
# ci-dessus (PEP 621) ; cette section ne sert qu'à préciser le paquet à
# empaqueter (sinon hatchling ne le détecte pas automatiquement).
[tool.hatch.build.targets.wheel]
packages = ["bg3_mod_tui"]
