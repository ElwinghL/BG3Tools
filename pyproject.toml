[project]
name = "bg3-mod-tui"
version = "0.1.0"
description = "TUI de gestion et téléchargement de mods BG3 (Nexus Mods / mod.io)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
]

[project.scripts]
bg3-mod-tui = "bg3_mod_tui.__main__:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bg3_mod_tui*"]
