name: CI

# Lance la suite pytest à chaque push/PR vers main, indépendamment du
# workflow Release (qui ne se déclenche que sur un bump de version dans
# pyproject.toml) — feedback rapide sur toute régression.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: debian-git-bun
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3

      - name: Installer les dépendances
        run: uv sync --extra dev

      - name: Lancer ruff (lint)
        run: uv run ruff check .

      - name: Lancer pytest avec couverture
        run: uv run pytest -q --cov --cov-report=term-missing
