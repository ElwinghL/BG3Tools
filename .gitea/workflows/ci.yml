name: CI

# Lance la suite pytest à chaque push/PR vers main, indépendamment du
# workflow Release (qui ne se déclenche que sur un bump de version dans
# pyproject.toml) — feedback rapide sur toute régression.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: debian-git-bun
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python et les dépendances
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip >/dev/null
          python3 -m pip install --break-system-packages -e ".[dev]"

      - name: Lancer pytest
        run: python3 -m pytest -q
